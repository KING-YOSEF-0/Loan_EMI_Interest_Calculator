<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pakistan Loan / EMI Calculator · by KING_YOSEF_</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="calculator-container">
    <div class="card">
      <h1>🇵🇰 Loan / EMI Calculator</h1>
      <p class="credit">by <span class="name">KING_YOSEF_</span></p>

      <!-- Inputs -->
      <div class="input-group">
        <label for="principal">Loan Amount (PKR)</label>
        <input type="number" id="principal" placeholder="e.g. 1000000" min="0" step="1000" value="1000000">
      </div>

      <div class="input-group">
        <label for="rate">Annual Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="e.g. 12" min="0" step="0.01" value="12">
      </div>

      <div class="input-group">
        <label for="tenure">Loan Tenure (months)</label>
        <input type="number" id="tenure" placeholder="e.g. 60" min="1" step="1" value="60">
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button id="calculateBtn">Calculate EMI</button>
        <button id="resetBtn" class="reset">Reset</button>
      </div>

      <!-- Results -->
      <div class="results" id="results">
        <div class="result-item">
          <span>Monthly EMI:</span>
          <span id="emiResult">—</span>
        </div>
        <div class="result-item">
          <span>Total Interest:</span>
          <span id="interestResult">—</span>
        </div>
        <div class="result-item">
          <span>Total Payment:</span>
          <span id="totalResult">—</span>
        </div>
      </div>

      <!-- Breakdown -->
      <div class="breakdown" id="breakdown">
        <p>💡 <span id="breakdownText">Enter values and click Calculate</span></p>
      </div>

      <!-- Footer -->
      <div class="footer">
        Made with ❤️ by <span class="name">KING_YOSEF_</span> · Pakistan 🇵🇰
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
